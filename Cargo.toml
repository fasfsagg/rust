[workspace]
members = [".", "migration"]

[package]
name = "axum-tutorial"
version = "0.1.0"
edition = "2024"
authors = ["Rust学习者"]
description = "Axum框架的分层架构学习项目"

[dependencies]
# Axum Web 框架核心组件 - 升级到 0.8.4
axum = { version = "0.8.4", features = ["ws", "macros"] }
# axum-extra = { version = "0.10.1", features = ["spa"] }
# Tokio 异步运行时 - 升级到最新稳定版本
tokio = { version = "1.45.1", features = ["full"] }
# 序列化与反序列化库 - 保持最新
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# 唯一ID生成 - 升级到最新版本
uuid = { version = "1.11", features = ["v4", "serde"] }
# 日志与跟踪 - 升级到最新版本
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# HTTP 工具库 - 升级到与 Axum 0.8.4 兼容的版本
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.6", features = ["trace", "cors", "fs"] }
# HTTP/3 支持（可选功能）- 暂时注释掉以简化升级过程
# quinn = "0.11"
# h3 = "0.0.6"
# h3-quinn = "0.0.7"
# TLS 支持 - 暂时注释掉以简化升级过程
# rustls = "0.23"
# tokio-rustls = "0.26"
# 证书生成工具（用于 HTTP/3 演示）- 暂时注释掉以简化升级过程
# rcgen = "0.13"
# 同步原语 - 升级到最新版本
parking_lot = "0.12"
# SeaORM
sea-orm = { version = "0.12", features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
# 迁移 Crate
migration = { path = "migration" }
anyhow = "1.0.82"
chrono = { version = "0.4.41", features = ["serde"] }
# 异步 Trait 支持 - 在 Axum 0.8.4 中仍然需要用于 dyn compatible traits
async-trait = "0.1"

# --- 认证与验证功能新增依赖 ---
# 输入验证
validator = { version = "0.18", features = ["derive"] }
# 密码哈希 - 使用 Argon2 (更安全的现代密码哈希算法)
argon2 = { version = "0.5", features = ["password-hash"] }
# 随机数生成器 - 用于生成盐值
rand_core = { version = "0.6", features = ["getrandom"] }
# JSON Web Token (JWT)
jsonwebtoken = "9.3"
# 环境变量加载
dotenvy = "0.15"
# URL 编码解析（用于 WebSocket 查询参数）
serde_urlencoded = "0.7"
# --- 认证与验证功能新增依赖结束 ---

[dev-dependencies]
anyhow = "1.0.82"
httpc-test = "0.1.9"
sea-orm-cli = "0.12"
reqwest = "0.12.4"
once_cell = "1.19.0"
wiremock = "0.6.0"
serde_json = "1.0.117"
fake = { version = "2.9", features = ["chrono"] }
# 模拟测试库
mockall = "0.12"
# URL 编码解析（用于 WebSocket 测试）
serde_urlencoded = "0.7"
# WebSocket 客户端（用于集成测试）
tokio-tungstenite = "0.21"
# Axum 测试工具
axum-test = "14.0"
# Futures 工具
futures-util = "0.3"
