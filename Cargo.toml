[workspace]
members = [".", "migration"]

[package]
name = "axum-tutorial"
version = "0.1.0"
edition = "2024"
authors = ["Rust学习者"]
description = "Axum框架的分层架构学习项目"

[dependencies]
# Axum Web 框架核心组件 - 升级到 0.8.4
axum = { version = "0.8.4", features = ["ws", "macros"] }
# axum-extra = { version = "0.10.1", features = ["spa"] }
# Tokio 异步运行时 - 升级到最新稳定版本
tokio = { version = "1.45.1", features = ["full"] }
# 序列化与反序列化库 - 保持最新
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# 唯一ID生成 - 升级到最新版本
uuid = { version = "1.11", features = ["v4", "serde"] }
# 日志与跟踪 - 升级到最新版本，增强错误处理和日志记录功能
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "time", "local-time"] }
# 错误跟踪和上下文
tracing-error = "0.2"
# 日志文件轮转和管理
tracing-appender = "0.2"
# HTTP 工具库 - 升级到与 Axum 0.8.4 兼容的版本
tower = { version = "0.5.2", features = ["util", "timeout"] }
tower-http = { version = "0.6.6", features = ["trace", "cors", "fs", "timeout"] }
# HTTP/3 支持（可选功能）- 暂时注释掉以简化升级过程
# quinn = "0.11"
# h3 = "0.0.6"
# h3-quinn = "0.0.7"
# TLS 支持 - 暂时注释掉以简化升级过程
# rustls = "0.23"
# tokio-rustls = "0.26"
# 证书生成工具（用于 HTTP/3 演示）- 暂时注释掉以简化升级过程
# rcgen = "0.13"
# 同步原语 - 升级到最新版本
parking_lot = "0.12"
# SeaORM - 升级到1.1.12版本，支持最新的mock功能和API改进，使用native-tls避免aws-lc-sys编译问题
sea-orm = { version = "1.1.12", features = ["sqlx-sqlite", "runtime-tokio-native-tls", "mock"] }
# 迁移 Crate
migration = { path = "migration" }
anyhow = "1.0.82"
chrono = { version = "0.4.41", features = ["serde"] }
# 异步 Trait 支持 - 在 Axum 0.8.4 中仍然需要用于 dyn compatible traits
async-trait = "0.1"
# Futures 工具 - 用于 WebSocket 流处理
futures-util = "0.3"
# 性能监控和指标收集
metrics = "0.23"
metrics-exporter-prometheus = "0.15"
# 系统信息收集
sysinfo = "0.32"
# 错误恢复机制依赖
backoff = "0.4"  # 指数退避重试
failsafe = "1.0"  # 断路器模式和错误恢复

# --- 认证与验证功能新增依赖 ---
# 输入验证
validator = { version = "0.18", features = ["derive"] }
# 密码哈希 - 使用 Argon2 (更安全的现代密码哈希算法)
argon2 = { version = "0.5", features = ["password-hash"] }
# 随机数生成器 - 用于生成盐值
rand_core = "0.6"
# 随机数生成器 - 用于生成随机数
rand = "0.8"
# JSON Web Token (JWT)
jsonwebtoken = "9.3"
# 环境变量加载
dotenvy = "0.15"
# URL 编码解析（用于 WebSocket 查询参数）
serde_urlencoded = "0.7"
bytes = "1.10.1"
flate2 = "1.1.2"
# --- 认证与验证功能新增依赖结束 ---

# --- 测试工具依赖 (在主依赖中，但可选) ---
# 这些依赖被测试模块使用，但也可能被集成测试需要
tempfile = { version = "3.8", optional = true }
reqwest = { version = "0.12.4", optional = true }
tokio-tungstenite = { version = "0.23", optional = true }
url = { version = "2.5", optional = true }

[features]
default = []
# 测试特性，启用测试工具依赖
testing = ["tempfile", "reqwest", "tokio-tungstenite", "url"]

[dev-dependencies]
# 基础测试依赖
anyhow = "1.0.82"
serde_json = "1.0.117"
once_cell = "1.19.0"

# HTTP 测试工具
httpc-test = "0.1.9"
# reqwest = "0.12.4"  # 已移动到主依赖，通过 testing 特性提供
axum-test = "17.3"

# 数据库测试工具
sea-orm-cli = "1.1"

# 模拟和测试数据生成
wiremock = "0.6.0"
fake = { version = "2.9", features = ["chrono"] }
mockall = "0.12"

# WebSocket 测试 - 这些依赖现在在主依赖中通过 testing 特性提供
# tokio-tungstenite = "0.23"  # 已移动到主依赖
serde_urlencoded = "0.7"
# url = "2.5"  # 已移动到主依赖

# 异步测试工具
tokio-test = "0.4"
futures-util = "0.3"

# 日志测试
tracing-test = "0.2"

# 文件系统测试
# tempfile = "3.8"  # 已移动到主依赖，通过 testing 特性提供
filetime = "0.2"

# 性能基准测试
criterion = { version = "0.6.0", features = ["html_reports"] }

# 测试覆盖率工具 - 应该通过 cargo install cargo-tarpaulin 安装，而不是作为依赖

# 测试断言增强
assert_matches = "1.5"
pretty_assertions = "1.4"

# 测试并发控制
serial_test = "3.1"

[[example]]
name = "message_distributor_demo"
path = "examples/message_distributor_demo.rs"

[[example]]
name = "log_rotation_demo"
path = "examples/log_rotation_demo.rs"


